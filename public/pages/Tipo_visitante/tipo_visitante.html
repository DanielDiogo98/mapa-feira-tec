<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM - Acesso</title>
    <link rel="stylesheet" href="visitante.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="pagina">

        <!--Cabeçalho-->
        <header class="cabecalho">

            <a href="../../index.html" class="botao-voltar" aria-label="Voltar">
                <span></span>
            </a>

            <div class="logo">
                <a href="../../index.html">
                    <img src="img/download.png" alt="Logo MCM">
                </a>
            </div>


        </header>

        <!--Opções de acesso-->
        <section class="opcoes">



            <!--Aluno-->
            <div class="card">
                <h2>Aluno</h2>
                <p>Alunos com projetos</p>

                <a class="btn-entrar" href="/entrar/aluno">Entrar como aluno</a>
            </div>

            <!--Professor-->
            <div class="card">
                <h2>Professor</h2>
                <p>Professores avaliadores</p>

                <a class="btn-entrar" href="/entrar/professor">Entrar como professor</a>
            </div>

        </section>

        <p class="aviso-redirecionamento" id="aviso-redirecionamento" role="alert" hidden>
            O acesso ainda não foi configurado. Tente novamente mais tarde.
        </p>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('erro') === 'acesso-nao-configurado') {
            document.getElementById('aviso-redirecionamento').hidden = false;
        }
    </script>
</body>

</html>
